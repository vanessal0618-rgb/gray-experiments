<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interference Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: black instrument panel on the left, shader stage filling the rest; stacks on phones. */
:root {
  --page: #e2e4e7;
  --page-fg: #1a1c20;
  --panel: #0a0a0b;
  --panel-fg: #f0f0ee;
  --panel-muted: #7b7d82;
  --panel-line: #26272a;
  --track: #4a4b50;
  --accent: #4b3bff;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page: #111214; --page-fg: #e6e7ea; color-scheme: dark; }
}
:root[data-theme="dark"] { --page: #111214; --page-fg: #e6e7ea; color-scheme: dark; }

body { background: var(--page); color: var(--page-fg); font-family: var(--mono); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }

.app {
  position: fixed;
  top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); left: 0; right: 0;
  display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; padding: 16px;
}
.panel {
  background: var(--panel); color: var(--panel-fg);
  border-radius: 18px; padding: 22px 22px 18px;
  overflow-y: auto; min-height: 0;
  display: flex; flex-direction: column;
  scrollbar-width: thin; scrollbar-color: #333 transparent;
}
.ph { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-bottom: 16px; }
.ph b { font-weight: 500; font-size: 12px; letter-spacing: .14em; }
.ph span { font-size: 10px; color: var(--panel-muted); }
.sec { display: grid; gap: 16px; padding-block: 18px; border-top: 1px solid var(--panel-line); }
.sec:first-of-type { border-top: 0; padding-top: 0; }
.lbl { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--panel-fg); }
.sub { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--panel-muted); }
.hint { font-size: 10px; line-height: 1.5; color: var(--panel-muted); margin: -6px 0 0; }

.sl { display: grid; gap: 2px; }
.sl .lbl { cursor: help; }
.track { position: relative; height: 24px; }
.track input { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 24px; margin: 0; background: transparent; cursor: pointer; }
.track input::-webkit-slider-runnable-track { height: 1px; background: var(--track); }
.track input::-moz-range-track { height: 1px; background: var(--track); }
.track input::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 0; margin-top: -11.5px; }
.track input::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 0; }
.track input:focus-visible { outline: none; }
.track input:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--accent); }
.track input:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px var(--accent); }
.bubble { position: absolute; top: 0; width: 24px; height: 24px; line-height: 24px; text-align: center; font-size: 9.5px; font-weight: 500; color: #000; pointer-events: none; font-variant-numeric: tabular-nums; }

.dials { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; }
.dial { display: grid; justify-items: center; gap: 6px; }
.knob { position: relative; width: 64px; height: 64px; border-radius: 50%; background: #fff; color: #000; display: grid; place-items: center; cursor: grab; touch-action: none; box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 5px #d9d6ff; }
.knob:active { cursor: grabbing; }
.knob:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.knob span { font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; pointer-events: none; }
.needle { position: absolute; left: 50%; top: 50%; width: 29px; height: 0; transform-origin: 0 0; pointer-events: none; }
.needle::after { content: ""; position: absolute; right: -1px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.dv { font-size: 10px; color: var(--panel-muted); font-variant-numeric: tabular-nums; }

.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn {
  font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
  height: 32px; padding: 0 10px; border-radius: 3px; cursor: pointer;
  background: transparent; color: var(--panel-fg); border: 1px solid #d8d8d8;
}
.btn:hover { background: #1b1b1e; }
.btn.fill { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.fill:hover { background: #3b2bef; }
.btn.quiet { border-color: #3a3b3f; color: var(--panel-muted); }
.btn.quiet:hover { color: var(--panel-fg); }
.btn:focus-visible, .seg button:focus-visible, .chip:focus-visible, .sw:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[disabled] { opacity: .5; cursor: progress; }

.comps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.comp { display: grid; gap: 5px; padding: 4px 4px 6px; border-radius: 5px; border: 1px solid #2e2f33; background: transparent; color: var(--panel-muted); cursor: pointer; font: 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.comp canvas { width: 100%; height: auto; display: block; border-radius: 3px; background: #1a1a1c; }
.comp:hover { color: var(--panel-fg); }
.comp[aria-pressed="true"] { border-color: var(--panel-fg); color: var(--panel-fg); box-shadow: inset 0 0 0 1px var(--panel-fg); }
.comp:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.chip { font: 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; height: 30px; border-radius: 3px; border: 1px solid #3a3b3f; background: transparent; color: var(--panel-muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.chip:hover { color: var(--panel-fg); }
.chip[aria-pressed="true"] { background: var(--panel-fg); color: var(--panel); border-color: var(--panel-fg); }
.chip i { width: 10px; height: 10px; border-radius: 50%; flex: none; }

.seg { display: inline-flex; border: 1px solid #3a3b3f; border-radius: 3px; overflow: hidden; }
.seg button { font: 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; background: transparent; color: var(--panel-muted); border: 0; padding: 7px 9px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel-fg); color: var(--panel); }

.sws { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.swc { display: grid; justify-items: center; gap: 4px; font-size: 8.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--panel-muted); }
.sw { -webkit-appearance: none; appearance: none; width: 28px; height: 28px; padding: 0; border: 1px solid #3a3b3f; border-radius: 50%; background: none; cursor: pointer; overflow: hidden; }
.sw::-webkit-color-swatch-wrapper { padding: 0; }
.sw::-webkit-color-swatch { border: 0; border-radius: 50%; }
.sw::-moz-color-swatch { border: 0; border-radius: 50%; }

.status { min-height: 14px; font-size: 10px; color: var(--panel-muted); padding-top: 4px; }

.stage { position: relative; border-radius: 18px; overflow: hidden; display: grid; place-items: center; min-height: 0; min-width: 0; background: #cfd0d3; }
.stage canvas { display: block; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 20px 50px -20px rgba(20,20,40,.25); }
.err { padding: 24px; max-width: 46ch; font-size: 12px; line-height: 1.6; color: #1a1c20; }

@media (max-width: 760px) {
  .app { position: static; grid-template-columns: minmax(0, 1fr); padding: 16px; }
  .stage { height: min(62vh, 100vw); order: -1; }
  .panel { overflow: visible; }
}
.txt { width: 100%; background: #141416; color: var(--panel-fg); border: 1px solid #3a3b3f; border-radius: 3px; font-family: var(--mono); }
</style>

<div class="app">
  <aside class="panel" aria-label="Interference controls">
    <div class="ph"><b>INTERFERENCE</b><span id="compName">Pair</span></div>

    <div class="sec">
      <span class="lbl">Composition</span>
      <div class="comps" id="comps" role="group" aria-label="Composition"></div>
      <div class="row"><span class="lbl" title="Morph through every composition in turn.">Auto cycle</span>
        <div class="seg" role="group" aria-label="Auto cycle">
          <button type="button" data-cycle="off">Off</button>
          <button type="button" data-cycle="on">On</button>
        </div>
      </div>
      <div id="timingCtl" style="display:grid;gap:16px"></div>
    </div>

    <div class="sec" id="glassCtl">
      <span class="sub">Glass filter</span>
      <div class="chips" role="group" aria-label="Glass type">
        <button type="button" class="chip" data-gtype="off">Off</button>
        <button type="button" class="chip" data-gtype="ripple">Ripple</button>
        <button type="button" class="chip" data-gtype="reeds">Reeds</button>
        <button type="button" class="chip" data-gtype="liquid">Liquid</button>
        <button type="button" class="chip" data-gtype="lens">Lens</button>
      </div>
      <div class="row"><span class="lbl">Cover</span>
        <div class="seg" role="group" aria-label="Glass coverage">
          <button type="button" data-gcover="full">Full</button>
          <button type="button" data-gcover="pane">Pane</button>
          <button type="button" data-gcover="circle">Circle</button>
        </div>
      </div>
      <div class="row"><span class="lbl" title="The glass glides back and forth across the composition.">Sweep</span>
        <div class="seg" role="group" aria-label="Sweep">
          <button type="button" data-gsweep="off">Off</button>
          <button type="button" data-gsweep="on">On</button>
        </div>
      </div>
      <p class="hint">Drag on the image to move the glass.</p>
      <div class="dials" id="glassDials"></div>
    </div>

    <div class="sec" id="formCtl"><span class="sub">Form</span><div class="dials" id="formDials"></div></div>
    <div class="sec" id="waveCtl"><span class="sub">Bands</span></div>

    <div class="sec" id="colorCtl">
      <span class="sub">Color</span>
      <div class="chips" role="group" aria-label="Palette" id="palChips"></div>
      <div class="sws">
        <label class="swc"><input type="color" class="sw" data-col="k0">Center</label>
        <label class="swc"><input type="color" class="sw" data-col="k1">Inner</label>
        <label class="swc"><input type="color" class="sw" data-col="k2">Mid</label>
        <label class="swc"><input type="color" class="sw" data-col="k3">Rim</label>
        <label class="swc"><input type="color" class="sw" data-col="k4">Fringe</label>
        <label class="swc"><input type="color" class="sw" data-col="bg">Ground</label>
      </div>
    </div>

    <div class="sec" id="motionCtl"><span class="sub">Motion &amp; texture</span></div>

    <div class="sec">
      <span class="lbl">Export</span>
      <div class="row"><span class="lbl">Frame</span>
        <div class="seg" role="group" aria-label="Frame ratio">
          <button type="button" data-ar="16:9">16:9</button>
          <button type="button" data-ar="1:1">1:1</button>
          <button type="button" data-ar="4:5">4:5</button>
          <button type="button" data-ar="9:16">9:16</button>
        </div>
      </div>
      <div class="btns">
        <button class="btn fill" id="exPng" type="button">PNG</button>
        <button class="btn" id="exVid" type="button">Record</button>
      </div>
      <div class="btns">
        <button class="btn" id="play" type="button">Pause</button>
        <button class="btn quiet" id="reset" type="button">Reset</button>
      </div>
      <div class="btns">
        <button class="btn quiet" id="copySet" type="button">Copy settings</button>
        <button class="btn quiet" id="loadSet" type="button">Load settings</button>
      </div>
      <textarea class="txt" id="setBox" rows="4" hidden aria-label="Settings code" style="height:auto;padding:8px 10px;font-size:10px;line-height:1.4;resize:vertical"></textarea>
      <button class="btn" id="applySet" type="button" hidden>Apply pasted settings</button>
      <div class="status" id="status" aria-live="polite"></div>
    </div>
  </aside>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Interference field preview"></canvas>
  </main>
</div>

<script>
(() => {
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clone = o => JSON.parse(JSON.stringify(o));

  // Every composition is a point in the same parameter space, so any two morph smoothly.
  const COMPS = {
    orb:     { name: "Orb",     size: 42, sizeB: 0,   sep: 0,  angle: 0,  merge: 0,  bridge: 0,  stretch: 0,   rings: 14,  freq: 40, falloff: 30,  disp: 25, balance: 0,  core: 15, soft: 30 },
    pair:    { name: "Pair",    size: 30, sizeB: 100, sep: 58, angle: 0,  merge: 0,  bridge: 70, stretch: 0,   rings: 16,  freq: 45, falloff: 22,  disp: 30, balance: 70, core: 22, soft: 35 },
    capsule: { name: "Capsule", size: 30, sizeB: 100, sep: 34, angle: 90, merge: 92, bridge: 0,  stretch: 0,   rings: 40,  freq: 62, falloff: 75,  disp: 55, balance: 15, core: 10, soft: 22 },
    field:   { name: "Field",   size: 24, sizeB: 0,   sep: 0,  angle: 0,  merge: 0,  bridge: 0,  stretch: 100, rings: 35,  freq: 28, falloff: 90,  disp: 20, balance: 0,  core: 0,  soft: 75 },
    core:    { name: "Core",    size: 34, sizeB: 0,   sep: 0,  angle: 0,  merge: 0,  bridge: 0,  stretch: 0,   rings: 8,   freq: 30, falloff: 55,  disp: 15, balance: 0,  core: 85, soft: 55 },
    halo:    { name: "Halo",    size: 26, sizeB: 0,   sep: 0,  angle: 0,  merge: 0,  bridge: 0,  stretch: 0,   rings: 60,  freq: 55, falloff: 100, disp: 50, balance: 0,  core: 15, soft: 25 }
  };
  const ORDER = Object.keys(COMPS);
  const SHAPE = ["size", "sizeB", "sep", "angle", "merge", "bridge", "stretch", "rings", "freq", "falloff", "disp", "balance", "core", "soft"];

  const PALETTES = {
    iris:   { name: "Iris",   k0: "#6a5be6", k1: "#a45fe0", k2: "#d77cc6", k3: "#6aa2ec", k4: "#eaa8ea", bg: "#eff1f4" },
    cobalt: { name: "Cobalt", k0: "#0d1b78", k1: "#1f5ff0", k2: "#2f8cf5", k3: "#9a8af2", k4: "#f4a3db", bg: "#f7f6f8" },
    lilac:  { name: "Lilac",  k0: "#aeb1f6", k1: "#c3b0f6", k2: "#d8c6f8", k3: "#e9d6fb", k4: "#f1c9f5", bg: "#e4daf7" },
    ember:  { name: "Ember",  k0: "#c93a22", k1: "#ef7a3c", k2: "#f6a76a", k3: "#f0b98d", k4: "#f6d9c4", bg: "#f6f1ea" },
    mono:   { name: "Mono",   k0: "#1d1f24", k1: "#4b4f58", k2: "#8c9099", k3: "#c4c7cd", k4: "#dfe1e5", bg: "#f2f2f0" },
    night:  { name: "Night",  k0: "#3b2df0", k1: "#7c4dff", k2: "#d35cd8", k3: "#3aa0ff", k4: "#ff7ad9", bg: "#06070b" }
  };

  function defaults() {
    const c = COMPS.pair, p = PALETTES.iris;
    const S = { comp: "pair", palette: "iris", ar: "16:9", cycle: "off", hold: 2, morph: 2.5, flow: 30, pulse: 45, speed: 40, grain: 12,
      gtype: "ripple", gcover: "full", gsweep: "off", gx: 0, gy: 0, gsize: 55, grefr: 30, gfreq: 55, gflow: 35, gchroma: 35, ghi: 40, gfrost: 0, gang: 0 };
    for (const k of SHAPE) S[k] = c[k];
    for (const k of ["k0", "k1", "k2", "k3", "k4", "bg"]) S[k] = p[k];
    // approved look for the shared site
    return Object.assign(S, {"comp": "pair", "palette": "mono", "ar": "16:9", "cycle": "off", "hold": 2, "morph": 2.5, "flow": 30, "pulse": 45, "speed": 40, "grain": 12, "gtype": "ripple", "gcover": "full", "gsweep": "off", "gx": 0, "gy": 0, "gsize": 97, "grefr": 69, "gfreq": 55, "gflow": 35, "gchroma": 35, "ghi": 12, "gfrost": 0, "gang": 0, "size": 30, "sizeB": 100, "sep": 58, "angle": 0, "merge": 0, "bridge": 70, "stretch": 0, "rings": 16, "freq": 45, "falloff": 22, "disp": 30, "balance": 70, "core": 22, "soft": 35, "k0": "#1d1f24", "k1": "#4b4f58", "k2": "#8c9099", "k3": "#c4c7cd", "k4": "#dfe1e5", "bg": "#f2f2f0"});
  }
  const KEY = "interference-field-v2";
  let S = defaults();
  try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) S = Object.assign(defaults(), s); } catch (e) {}
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  const $ = id => document.getElementById(id);
  const cv = $("cv"), stage = $("stage");
  let dirty = true;
  const changed = () => { persist(); dirty = true; };

  // ---------- sliders ----------
  const SLIDERS = [
    ["gsize", "Glass size", "Size of the pane or circle, and how far ripples spread.", "glassCtl"],
    ["grefr", "Refraction", "How strongly the glass bends the pattern beneath it.", "glassCtl"],
    ["gfreq", "Scale", "Density of the ripples, reeds or liquid waves.", "glassCtl"],
    ["gflow", "Glass flow", "How fast the glass surface moves.", "glassCtl"],
    ["gchroma", "Chroma", "Splits colors at the bends, like light through real glass.", "glassCtl"],
    ["ghi", "Highlight", "Specular light catching the glass surface.", "glassCtl"],
    ["gfrost", "Frost", "Frosted, sandblasted texture inside the glass.", "glassCtl"],
    ["size", "Size", "Radius of the main orb.", "formCtl"],
    ["sizeB", "Second orb", "Size of the second orb, relative to the first. 0 hides it.", "formCtl"],
    ["sep", "Separation", "Distance between the two orbs.", "formCtl"],
    ["merge", "Merge", "How much the two orbs melt into one shape.", "formCtl"],
    ["bridge", "Bridge", "Smeared band of light connecting the two orbs.", "formCtl"],
    ["stretch", "Stretch", "Pulls the orb sideways into horizontal bands.", "formCtl"],
    ["soft", "Softness", "How much edges blur into the ground.", "formCtl"],
    ["rings", "Rings", "Strength of the concentric interference rings.", "waveCtl"],
    ["freq", "Frequency", "How many rings fit across the orb.", "waveCtl"],
    ["falloff", "Echo", "How far the rings ripple out beyond the edge.", "waveCtl"],
    ["disp", "Dispersion", "Splits the rings into iridescent color fringes.", "waveCtl"],
    ["balance", "Balance", "Shifts the left orb to a different color state than the right.", "colorCtl"],
    ["core", "Core depth", "Darkens the very center of each orb.", "colorCtl"],
    ["flow", "Ring flow", "How fast rings travel outward.", "motionCtl"],
    ["pulse", "Pulse", "Orbs swap color states and breathe over time.", "motionCtl"],
    ["speed", "Speed", "Overall speed of all motion.", "motionCtl"],
    ["grain", "Grain", "Film grain over the whole image.", "motionCtl"],
    ["hold", "Hold", "Seconds each composition holds during auto cycle.", "timingCtl", 0, 8, 0.5],
    ["morph", "Morph", "Seconds each transition takes, during auto cycle and when you pick a composition.", "timingCtl", 0.5, 6, 0.5]
  ];
  const sliderEls = {};
  for (const [k, name, tip, parent, min = 0, max = 100, step = 1] of SLIDERS) {
    const w = document.createElement("div");
    w.className = "sl";
    w.innerHTML = `<label class="lbl" for="s-${k}" title="${tip}">${name}</label>
      <div class="track"><input type="range" id="s-${k}" min="${min}" max="${max}" step="${step}"><span class="bubble" aria-hidden="true"></span></div>`;
    const host = $(parent);
    if (parent === "formCtl") host.insertBefore(w, $("formDials"));
    else if (parent === "glassCtl") host.insertBefore(w, $("glassDials"));
    else if (parent === "colorCtl") host.appendChild(w);
    else host.appendChild(w);
    const input = w.querySelector("input"), bub = w.querySelector(".bubble");
    sliderEls[k] = { input, bub, min, max };
    input.addEventListener("input", () => { tween = null; S[k] = +input.value; syncSlider(k); changed(); });
  }
  function syncSlider(k) {
    const { input, bub, min, max } = sliderEls[k], v = S[k];
    input.value = v;
    bub.textContent = Number.isInteger(+v) ? Math.round(v) : (+v).toFixed(1);
    bub.style.left = `calc(${(v - min) / (max - min)} * (100% - 24px))`;
  }

  // ---------- dial ----------
  const dials = {};
  function makeDial(key, label, host) {
    const d = document.createElement("div");
    d.className = "dial";
    d.innerHTML = `<div class="knob" role="slider" tabindex="0" aria-label="${label}" aria-valuemin="0" aria-valuemax="359"><div class="needle"></div><span>${label}</span></div><div class="dv"></div>`;
    host.appendChild(d);
    const knob = d.querySelector(".knob"), needle = d.querySelector(".needle"), dv = d.querySelector(".dv");
    dials[key] = { knob, needle, dv };
    const setFrom = e => {
      const r = knob.getBoundingClientRect();
      const a = Math.atan2(-(e.clientY - r.top - r.height / 2), e.clientX - r.left - r.width / 2) * 180 / Math.PI;
      tween = null; S[key] = Math.round((a + 360) % 360); syncDial(key); changed();
    };
    knob.addEventListener("pointerdown", e => { knob.setPointerCapture(e.pointerId); setFrom(e); });
    knob.addEventListener("pointermove", e => { if (knob.hasPointerCapture(e.pointerId)) setFrom(e); });
    knob.addEventListener("keydown", e => {
      const step = e.shiftKey ? 15 : 5;
      if (e.key === "ArrowRight" || e.key === "ArrowUp") S[key] = (S[key] + step) % 360;
      else if (e.key === "ArrowLeft" || e.key === "ArrowDown") S[key] = (S[key] - step + 360) % 360;
      else return;
      tween = null; e.preventDefault(); syncDial(key); changed();
    });
  }
  function syncDial(key) {
    const { knob, needle, dv } = dials[key], v = Math.round(((S[key] % 360) + 360) % 360);

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    status("Saved " + name);
  }

  $("exPng").onclick = () => {
    const [aw, ah] = S.ar.split(":").map(Number);
    const long = Math.min(3200, gl.getParameter(gl.MAX_VIEWPORT_DIMS)[0]);
    const W = aw >= ah ? long : Math.round(long * aw / ah), H = aw >= ah ? Math.round(long * ah / aw) : long;
    const pw = cv.width, phh = cv.height;
    cv.width = W; cv.height = H;
    draw(S, simT, W, H, W / parseFloat(cv.style.width));
    cv.toBlob(b => {
      cv.width = pw; cv.height = phh; dirty = true;
      b ? saveFile(`interference-${S.comp}.png`, b) : status("PNG export failed");
    }, "image/png");
  };

  let recording = false;
  $("exVid").onclick = () => {
    if (recording) return;
    if (!cv.captureStream || typeof MediaRecorder === "undefined") { status("Video recording isn't supported in this browser."); return; }
    const mime = ["video/mp4;codecs=avc1", "video/webm;codecs=vp9", "video/webm", "video/mp4"].find(m => MediaRecorder.isTypeSupported(m));
    if (!mime) { status("Video recording isn't supported in this browser."); return; }
    const cycling = S.cycle === "on";
    if (cycling) { tween = null; goTo(ORDER[0]); tween = null; for (const k of SHAPE) S[k] = COMPS[ORDER[0]][k]; cycleAt = clock; }
    const secs = cycling ? ORDER.length * (S.hold + S.morph) : 8;
    if (!playing) { playing = true; syncUI(); }
    const rec = new MediaRecorder(cv.captureStream(60), { mimeType: mime, videoBitsPerSecond: 16e6 });
    const chunks = [];
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      recording = false;
      $("exVid").disabled = false; syncUI();
      const ext = mime.startsWith("video/mp4") ? "mp4" : "webm";
      saveFile(`interference-${cycling ? "cycle" : S.comp}-${Math.round(secs)}s.${ext}`, new Blob(chunks, { type: mime.split(";")[0] }));
    };
    recording = true;
    $("exVid").disabled = true; $("exVid").textContent = `Recording ${Math.round(secs)}s…`;
    rec.start(250);
    setTimeout(() => rec.stop(), secs * 1000);
  };

  // ---------- boot ----------
  syncUI();
  layout();
  requestAnimationFrame(tick);
})();
</script>
